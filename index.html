
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1420">
  <title>FINORA — Personal Finance</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b1420;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
      padding: 22px;
    }

    .container { max-width: 850px; margin: auto; }

    header { margin-bottom: 28px; }

    .logo {
      color: #5ee0a0;
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .subtitle { color: #94a3b8; margin-top: 6px; }

    .balance, .card, .panel {
      background: #142638;
      border: 1px solid #294052;
      border-radius: 15px;
      padding: 22px;
    }

    .balance { margin-bottom: 16px; }
    .muted { color: #a6b5c5; font-size: 13px; }

    .balance h1 { font-size: 34px; margin-top: 12px; }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .card h2 { margin-top: 10px; font-size: 21px; }
    .income { color: #5ee0a0; }
    .expense { color: #fb8585; }

    .panel { margin-bottom: 18px; }

    h3 { margin-bottom: 18px; font-size: 18px; }

    label {
      display: block;
      color: #b7c5d3;
      font-size: 13px;
      margin: 13px 0 7px;
    }

    input, select {
      width: 100%;
      background: #0b1927;
      border: 1px solid #344b5d;
      border-radius: 9px;
      color: white;
      padding: 12px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #5ee0a0;
      color: #092016;
      width: 100%;
      margin-top: 18px;
    }

    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #294052;
    }

    .transaction:last-child { border-bottom: 0; }

    .transaction small {
      display: block;
      color: #94a3b8;
      margin-top: 5px;
    }

    .right { text-align: right; }

    .delete {
      background: #42272b;
      color: #ffaaaa;
      font-size: 12px;
      padding: 7px 9px;
      margin-top: 7px;
    }

    .empty {
      color: #94a3b8;
      font-size: 14px;
      padding: 12px 0;
    }

    @media (max-width: 520px) {
      body { padding: 15px; }
      .balance h1 { font-size: 28px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B1220">
</head>

<body>
<main class="container">

  <header>
    <div class="logo">FINORA.</div>
    <p class="subtitle">Personal Finance Manager</p>
  </header>

  <section class="balance">
    <p class="muted">TOTAL SALDO</p>
    <h1 id="balance">Rp0</h1>
  </section>

  <section class="cards">
    <div class="card">
      <p class="muted">TOTAL PEMASUKAN</p>
      <h2 class="income" id="income">Rp0</h2>
    </div>
    <div class="card">
      <p class="muted">TOTAL PENGELUARAN</p>
      <h2 class="expense" id="expense">Rp0</h2>
    </div>
  </section>

  <section class="panel">
    <h3>Tambah Transaksi</h3>

    <form id="transactionForm">
      <label for="type">Jenis transaksi</label>
      <select id="type">
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
      </select>

      <label for="description">Nama transaksi</label>
      <input id="description" placeholder="Contoh: Uang saku" required>

      <label for="amount">Nominal (Rp)</label>
      <input id="amount" type="number" min="1" step="1"
        placeholder="Contoh: 50000" required>

      <label for="category">Kategori</label>
      <select id="category">
        <option>Uang saku</option>
        <option>Makanan</option>
        <option>Transportasi</option>
        <option>Pendidikan</option>
        <option>Hiburan</option>
        <option>Tabungan</option>
        <option>Lainnya</option>
      </select>

      <label for="date">Tanggal</label>
      <input id="date" type="date" required>

      <button class="primary" type="submit">Simpan Transaksi</button>
    </form>
  </section>

  <section class="panel">
    <h3>Riwayat Transaksi</h3>
    <div id="transactions">
      <p class="empty">Memuat transaksi...</p>
    </div>
  </section>

  <p class="muted" id="status">Memuat penyimpanan...</p>

</main>

<script type="module" src="./js/app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => {
          console.log("FINORA offline mode aktif");
        })
        .catch(error => {
          console.error("Service Worker gagal:", error);
        });
    });
  }
</script>
</body>
</html>
