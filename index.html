
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1420">
  <title>FINORA — Personal Finance</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b1420;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
      padding: 22px;
    }

    .container { max-width: 850px; margin: auto; }

    header { margin-bottom: 28px; }

    .logo {
      color: #5ee0a0;
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .subtitle { color: #94a3b8; margin-top: 6px; }

    .balance, .card, .panel {
      background: #142638;
      border: 1px solid #294052;
      border-radius: 15px;
      padding: 22px;
    }

    .balance { margin-bottom: 16px; }
    .muted { color: #a6b5c5; font-size: 13px; }

    .balance h1 { font-size: 34px; margin-top: 12px; }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .card h2 { margin-top: 10px; font-size: 21px; }
    .income { color: #5ee0a0; }
    .expense { color: #fb8585; }

    .panel { margin-bottom: 18px; }

    h3 { margin-bottom: 18px; font-size: 18px; }

    label {
      display: block;
      color: #b7c5d3;
      font-size: 13px;
      margin: 13px 0 7px;
    }

    input, select {
      width: 100%;
      background: #0b1927;
      border: 1px solid #344b5d;
      border-radius: 9px;
      color: white;
      padding: 12px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #5ee0a0;
      color: #092016;
      width: 100%;
      margin-top: 18px;
    }

    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #294052;
    }

    .transaction:last-child { border-bottom: 0; }

    .transaction small {
      display: block;
      color: #94a3b8;
      margin-top: 5px;
    }

    .right { text-align: right; }

    .delete {
      background: #42272b;
      color: #ffaaaa;
      font-size: 12px;
      padding: 7px 9px;
      margin-top: 7px;
    }

    .empty {
      color: #94a3b8;
      font-size: 14px;
      padding: 12px 0;
    }

    @media (max-width: 520px) {
      body { padding: 15px; }
      .balance h1 { font-size: 28px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B1220">
</head>

<body>
<main class="container">

  <header>
    <div class="logo">FINORA.</div>
    <p class="subtitle">Personal Finance Manager</p>
  </header>

  <section class="balance">
    <p class="muted">TOTAL SALDO</p>
    <h1 id="balance">Rp0</h1>
  </section>

  <section class="cards">
    <div class="card">
      <p class="muted">TOTAL PEMASUKAN</p>
      <h2 class="income" id="income">Rp0</h2>
    </div>
    <div class="card">
      <p class="muted">TOTAL PENGELUARAN</p>
      <h2 class="expense" id="expense">Rp0</h2>
    </div>
  </section>

  <section class="panel">
    <h3>Tambah Transaksi</h3>

    <form id="transactionForm">
      <label for="type">Jenis transaksi</label>
      <select id="type">
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
      </select>

      <label for="description">Nama transaksi</label>
      <input id="description" placeholder="Contoh: Uang saku" required>

      <label for="amount">Nominal (Rp)</label>
      <input id="amount" type="number" min="1" step="1"
        placeholder="Contoh: 50000" required>

      <label for="category">Kategori</label>
      <select id="category">
        <option>Uang saku</option>
        <option>Makanan</option>
        <option>Transportasi</option>
        <option>Pendidikan</option>
        <option>Hiburan</option>
        <option>Tabungan</option>
        <option>Lainnya</option>
      </select>

      <label for="date">Tanggal</label>
      <input id="date" type="date" required>

      <button class="primary" type="submit">Simpan Transaksi</button>
    </form>
  </section>

  <section class="panel">
    <h3>Riwayat Transaksi</h3>
    <div id="transactions">
      <p class="empty">Memuat transaksi...</p>
    </div>
  </section>

  <p class="muted" id="status">Memuat penyimpanan...</p>

</main>

<script>
  const DB_NAME = "FINORA_DB";
  const STORE = "transactions";
  let db;

  const rupiah = value =>
    new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }).format(value);

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);

      request.onupgradeneeded = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains(STORE)) {
          database.createObjectStore(STORE, {
            keyPath: "id",
            autoIncrement: true
          });
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function getAllTransactions() {
    return new Promise((resolve, reject) => {
      const request = db.transaction(STORE, "readonly")
        .objectStore(STORE).getAll();

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function addTransaction(transaction) {
    return new Promise((resolve, reject) => {
      const request = db.transaction(STORE, "readwrite")
        .objectStore(STORE).add(transaction);

      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  function deleteTransaction(id) {
    return new Promise((resolve, reject) => {
      const request = db.transaction(STORE, "readwrite")
        .objectStore(STORE).delete(id);

      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async function render() {
    const items = await getAllTransactions();

    const income = items
      .filter(item => item.type === "income")
      .reduce((sum, item) => sum + item.amount, 0);

    const expense = items
      .filter(item => item.type === "expense")
      .reduce((sum, item) => sum + item.amount, 0);

    document.getElementById("balance").textContent =
      rupiah(income - expense);

    document.getElementById("income").textContent = rupiah(income);
    document.getElementById("expense").textContent = rupiah(expense);

    const container = document.getElementById("transactions");
    container.innerHTML = "";

    if (items.length === 0) {
      container.innerHTML =
        '<p class="empty">Belum ada transaksi.</p>';
      return;
    }

    items.sort((a, b) =>
      b.date.localeCompare(a.date) || b.id - a.id
    );

    items.forEach(item => {
      const row = document.createElement("div");
      row.className = "transaction";

      const info = document.createElement("div");
      const name = document.createElement("strong");
      name.textContent = item.description;

      const detail = document.createElement("small");
      detail.textContent =
        item.category + " • " + item.date;

      info.append(name, detail);

      const right = document.createElement("div");
      right.className = "right";

      const value = document.createElement("strong");
      value.className =
        item.type === "income" ? "income" : "expense";
      value.textContent =
        (item.type === "income" ? "+" : "-") +
        rupiah(item.amount);

      const button = document.createElement("button");
      button.className = "delete";
      button.textContent = "Hapus";
      button.addEventListener("click", async () => {
        if (confirm("Hapus transaksi ini?")) {
          await deleteTransaction(item.id);
          await render();
        }
      });

      right.append(value, document.createElement("br"), button);
      row.append(info, right);
      container.append(row);
    });
  }

  document.getElementById("date").value =
    new Date().toLocaleDateString("en-CA");

  document.getElementById("transactionForm")
    .addEventListener("submit", async event => {
      event.preventDefault();

      const description =
        document.getElementById("description").value.trim();
      const amount =
        Number(document.getElementById("amount").value);

      if (!description || !Number.isSafeInteger(amount) || amount <= 0) {
        alert("Periksa nama dan nominal transaksi.");
        return;
      }

      const transaction = {
        type: document.getElementById("type").value,
        description,
        amount,
        category: document.getElementById("category").value,
        date: document.getElementById("date").value
      };

      try {
        await addTransaction(transaction);
        event.target.reset();
        document.getElementById("date").value =
          new Date().toLocaleDateString("en-CA");
        await render();
      } catch (error) {
        alert("Transaksi gagal disimpan.");
      }
    });

  async function start() {
    try {
      if (!("indexedDB" in window)) {
        throw new Error("IndexedDB tidak tersedia");
      }

      db = await openDatabase();
      await render();

      document.getElementById("status").textContent =
        "Penyimpanan lokal aktif.";
    } catch (error) {
      document.getElementById("status").textContent =
        "Penyimpanan gagal diaktifkan.";
      console.error(error);
      alert("FINORA gagal membuka penyimpanan. Coba browser lain.");
    }
  }

  start();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => {
          console.log("FINORA offline mode aktif");
        })
        .catch(error => {
          console.error("Service Worker gagal:", error);
        });
    });
  }
</script>
</body>
</html>
